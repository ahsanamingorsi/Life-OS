<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life OS</title>
    <base href="/" />
    <script>
        // Theme: saved choice, else the Windows light/dark setting.
        (function () {
            try {
                var saved = localStorage.getItem("lifeos-theme");
                document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            } catch (e) { document.documentElement.dataset.theme = "light"; }
        })();
        window.lifeosTheme = {
            get: function () { return document.documentElement.dataset.theme; },
            set: function (theme) {
                document.documentElement.dataset.theme = theme;
                try { localStorage.setItem("lifeos-theme", theme); } catch (e) { }
            }
        };
    </script>
    <!-- Plus Jakarta Sans when online; Segoe UI is used offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app-base.css" />
    <link rel="stylesheet" href="css/lifeos-v2.css" />
    <link rel="stylesheet" href="LifeOS.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="app"><p style="padding:24px;font-family:Segoe UI,sans-serif;">Loading Life OS…</p></div>

    <div id="blazor-error-ui" data-nosnippet>
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
